<html>

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/celeste@4f043a5ce121b74dc54ce56d74f213a2eeea6b4e/">
    <title>CelesteWasm</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <link rel="icon" type="image/x-icon" href="assets/app.ico" />
    <link rel="prefetch" id="mountainsrc" href="assets/mountain.png">
    <link rel="stylesheet" href="styles.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&family=Material+Symbols+Rounded&display=swap"
        rel="stylesheet" />

    <script src="cfg.js"></script>
    <script src="data.js"></script>
    <script type="module" src="bundle.js"></script>
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            touch-action: manipulation;
        }
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
        }
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 180px;
            height: 180px;
            pointer-events: all;
            touch-action: none;
            z-index: 10000;
        }
        #joystick-base {
            position: absolute;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #joystick-thumb {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }
        .action-buttons {
            position: absolute;
            bottom: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: all;
            z-index: 10000;
        }
        .action-row {
            display: flex;
            gap: 15px;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .btn-dash {
            background: rgba(255, 80, 80, 0.4);
            border-color: rgba(255, 100, 100, 0.6);
        }
        .btn-dash:active {
            background: rgba(255, 60, 60, 0.8);
            transform: scale(0.95);
        }
        .btn-jump {
            background: rgba(80, 180, 255, 0.4);
            border-color: rgba(100, 200, 255, 0.6);
        }
        .btn-jump:active {
            background: rgba(60, 160, 255, 0.8);
            transform: scale(0.95);
        }
        .btn-grab {
            background: rgba(255, 200, 50, 0.4);
            border-color: rgba(255, 220, 80, 0.6);
        }
        .btn-grab:active {
            background: rgba(255, 180, 30, 0.8);
            transform: scale(0.95);
        }
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            pointer-events: all;
            z-index: 10000;
        }
        .top-btn {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        @media (pointer: coarse) {
            #mobile-controls {
                display: block;
            }
        }
        @media (pointer: coarse) and (orientation: landscape) {
            #joystick-zone {
                bottom: 15px;
                left: 15px;
                width: 150px;
                height: 150px;
            }
            #joystick-base {
                width: 115px;
                height: 115px;
            }
            #joystick-thumb {
                width: 50px;
                height: 50px;
            }
            .action-buttons {
                bottom: 25px;
                right: 15px;
                gap: 10px;
            }
            .action-row {
                gap: 10px;
            }
            .action-btn {
                width: 60px;
                height: 60px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div id="loading-textt" style="color: black; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING DOT.NET...</div>
    
    <div id="mobile-controls">
        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>
        <div class="top-buttons">
            <button class="top-btn" id="btn-esc">ESC</button>
            <button class="top-btn" id="btn-tab">TAB</button>
        </div>
        <div class="action-buttons">
            <div class="action-row">
                <button class="action-btn btn-dash" id="btn-c">C</button>
                <button class="action-btn btn-jump" id="btn-x">X</button>
            </div>
            <div class="action-row">
                <button class="action-btn btn-dash" id="btn-z">Z</button>
                <button class="action-btn btn-grab" id="btn-v">V</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            function simulateKey(code, type) {
                document.dispatchEvent(new KeyboardEvent(type, {
                    code: code,
                    key: code.startsWith('Key') ? code.replace('Key', '').toLowerCase() : code.replace('Arrow', '').toLowerCase(),
                    bubbles: true,
                    cancelable: true
                }));
            }
            function createButton(id, keyCode, holdable) {
                const btn = document.getElementById(id);
                let interval;
                function start(e) {
                    e.preventDefault();
                    simulateKey(keyCode, 'keydown');
                    if (holdable) {
                        interval = setInterval(() => simulateKey(keyCode, 'keydown'), 50);
                    }
                }
                function stop(e) {
                    e.preventDefault();
                    simulateKey(keyCode, 'keyup');
                    if (holdable && interval) {
                        clearInterval(interval);
                        interval = null;
                    }
                }
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', stop);
                btn.addEventListener('touchcancel', stop);
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
            }
            createButton('btn-x', 'KeyX', true);
            createButton('btn-z', 'KeyZ', false);
            createButton('btn-c', 'KeyC', false);
            createButton('btn-v', 'KeyV', false);
            createButton('btn-esc', 'Escape', false);
            createButton('btn-tab', 'Tab', false);
            const thumb = document.getElementById('joystick-thumb');
            const zone = document.getElementById('joystick-zone');
            const maxDist = 45;
            let activeTouchId = null;
            let currentDir = { left: false, right: false, up: false, down: false };
            function releaseAll() {
                const map = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' };
                for (let [key, active] of Object.entries(currentDir)) {
                    if (active) {
                        simulateKey(map[key], 'keyup');
                        currentDir[key] = false;
                    }
                }
            }
            function updateDirections(dx, dy) {
                const dead = 12;
                const dirs = { left: dx < -dead, right: dx > dead, up: dy < -dead, down: dy > dead };
                const map = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' };
                for (let [key, active] of Object.entries(dirs)) {
                    if (active && !currentDir[key]) {
                        simulateKey(map[key], 'keydown');
                        currentDir[key] = true;
                    } else if (!active && currentDir[key]) {
                        simulateKey(map[key], 'keyup');
                        currentDir[key] = false;
                    }
                }
            }
            function moveStick(clientX, clientY) {
                const rect = zone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                updateDirections(dx, dy);
            }
            function resetStick() {
                thumb.style.transform = 'translate(-50%, -50%)';
                releaseAll();
                activeTouchId = null;
            }
            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId === null) {
                    const t = e.changedTouches[0];
                    activeTouchId = t.identifier;
                    moveStick(t.clientX, t.clientY);
                }
            }, { passive: false });
            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        moveStick(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });
            zone.addEventListener('touchend', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        resetStick();
                        break;
                    }
                }
            });
            zone.addEventListener('touchcancel', resetStick);
            let mouseDown = false;
            zone.addEventListener('mousedown', (e) => {
                e.preventDefault();
                mouseDown = true;
                moveStick(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (mouseDown) moveStick(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (mouseDown) { mouseDown = false; resetStick(); }
            });
        })();
    </script>
</body>

</html>
